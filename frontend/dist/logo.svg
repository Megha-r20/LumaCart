<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lumaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="lumaInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Badge -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#lumaBgGrad)" filter="url(#glow)"/>
  
  <!-- Inner Glass Highlight Ring -->
  <rect x="7" y="7" width="86" height="86" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Stylized Geometric "L" Symbol -->
  <path d="M34 26 V66 H66" fill="none" stroke="url(#lumaInnerGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle Diamond -->
  <path d="M58 34 L62 26 L66 34 L74 38 L66 42 L62 50 L58 42 L50 38 Z" fill="#FFFFFF"/>
</svg>
